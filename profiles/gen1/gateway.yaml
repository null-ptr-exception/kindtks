apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: kindtks
  namespace: istio-ingress
spec:
  selector:
    istio: ingress
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.kindtks.localhost"
        - "*.kindtks.local"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: kindtks-tls
      hosts:
        - "*.kindtks.localhost"
        - "*.kindtks.local"
